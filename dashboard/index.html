<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BetEngine NHL</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏒</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: { ink: '#0b1120', panel: '#111a2e', line: 'rgba(148,163,184,.14)', accent: '#3b82f6' },
        },
      },
    };
  </script>
  <style>
    body { background: radial-gradient(1200px 600px at 10% -10%, rgba(59,130,246,.12), transparent 60%), #0b1120; }
    .card { background: rgba(17,26,46,.82); border: 1px solid rgba(148,163,184,.14); border-radius: 1rem; }
    .nav-link.active { background: rgba(59,130,246,.16); color: #fff; }
    .nav-link.active .dot { background: #3b82f6; }
    .tbl th { position: sticky; top: 0; background: #111a2e; z-index: 1; }
    .tbl tbody tr:hover { background: rgba(59,130,246,.08); }
    .tbl tr[data-href] { cursor: pointer; }
    .scroll-thin::-webkit-scrollbar { height: 8px; width: 8px; }
    .scroll-thin::-webkit-scrollbar-thumb { background: rgba(148,163,184,.25); border-radius: 8px; }
    .fade-in { animation: fade .25s ease-out; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .skeleton { background: linear-gradient(90deg, rgba(148,163,184,.08), rgba(148,163,184,.16), rgba(148,163,184,.08)); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: .75rem; }
    @keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  </style>
</head>
<body class="text-slate-200 font-sans antialiased min-h-screen">
  <!-- Barre mobile -->
  <header class="lg:hidden sticky top-0 z-30 flex items-center justify-between px-4 py-3 bg-ink/90 backdrop-blur border-b border-line">
    <a href="#/" class="font-extrabold text-lg tracking-tight">🏒 BetEngine <span class="text-accent">NHL</span></a>
    <button id="menu-btn" aria-label="Menu" class="p-2 rounded-lg hover:bg-white/5">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </header>

  <div class="flex">
    <!-- Navigation -->
    <aside id="sidebar" class="fixed lg:sticky top-0 left-0 z-40 h-screen w-64 shrink-0 -translate-x-full lg:translate-x-0 transition-transform bg-ink/95 lg:bg-transparent border-r border-line p-4 overflow-y-auto">
      <a href="#/" class="hidden lg:block font-extrabold text-xl tracking-tight px-3 py-2">🏒 BetEngine <span class="text-accent">NHL</span></a>
      <nav id="nav" class="mt-4 space-y-6 text-sm"></nav>
      <p id="updated" class="mt-8 px-3 text-xs text-slate-500"></p>
    </aside>
    <div id="backdrop" class="hidden fixed inset-0 z-30 bg-black/50 lg:hidden"></div>

    <main id="app" class="flex-1 min-w-0 px-4 sm:px-6 lg:px-10 py-6 lg:py-8 max-w-[1400px]"></main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
