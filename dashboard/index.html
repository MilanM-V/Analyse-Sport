<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetBot Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: '#0f172a',
                        card: '#1e293b',
                        accent: '#3b82f6',
                        success: '#10b981',
                        danger: '#ef4444'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }
        .gradient-text {
            background: linear-gradient(to right, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* Hide scrollbar for tables but keep functionality */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold gradient-text flex items-center gap-2">
                    <i data-lucide="activity"></i> BetBot Dashboard
                </h1>
                <p class="text-sm text-slate-400 mt-1" id="last-updated">Dernière mise à jour : Chargement...</p>
            </div>
            <button onclick="fetchData()" class="p-2 bg-card hover:bg-slate-700 rounded-full border border-slate-700 transition">
                <i data-lucide="refresh-cw" class="w-5 h-5 text-accent" id="refresh-icon"></i>
            </button>
        </header>

        <!-- KPIs Grid -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
            <div class="glass-card p-5">
                <p class="text-sm text-slate-400 font-medium">Bankroll Actuelle</p>
                <h2 class="text-2xl font-bold mt-2" id="kpi-balance">0.00 U</h2>
            </div>
            <div class="glass-card p-5">
                <p class="text-sm text-slate-400 font-medium">Profit Total</p>
                <h2 class="text-2xl font-bold mt-2" id="kpi-profit">0.00 U</h2>
            </div>
            <div class="glass-card p-5">
                <p class="text-sm text-slate-400 font-medium">ROI</p>
                <h2 class="text-2xl font-bold mt-2" id="kpi-roi">0.0%</h2>
            </div>
            <div class="glass-card p-5">
                <p class="text-sm text-slate-400 font-medium">Winrate</p>
                <h2 class="text-2xl font-bold mt-2" id="kpi-winrate">0.0%</h2>
            </div>
            <div class="glass-card p-5">
                <p class="text-sm text-slate-400 font-medium">Paris Placés</p>
                <h2 class="text-2xl font-bold mt-2" id="kpi-total-bets">0</h2>
            </div>
        </div>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Chart Section (Spans 2 columns) -->
            <div class="glass-card p-5 lg:col-span-2">
                <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
                    <i data-lucide="trending-up" class="w-5 h-5 text-accent"></i> Évolution Bankroll
                </h3>
                <div class="h-72 w-full relative">
                    <canvas id="evolutionChart"></canvas>
                </div>
            </div>

            <!-- Active Bets Section -->
            <div class="glass-card p-5 flex flex-col">
                <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
                    <i data-lucide="clock" class="w-5 h-5 text-yellow-400"></i> Paris en cours (<span id="active-count">0</span>)
                </h3>
                <div class="overflow-y-auto flex-1 hide-scrollbar" style="max-height: 288px;">
                    <div id="active-bets-container" class="space-y-3">
                        <!-- Injected via JS -->
                    </div>
                </div>
                <div class="mt-4 pt-4 border-t border-slate-700 flex justify-between items-center text-sm">
                    <span class="text-slate-400">Exposition :</span>
                    <span class="font-bold text-yellow-400" id="pending-exposure">0.00 U</span>
                </div>
            </div>
            
        </div>

        <!-- History Table -->
        <div class="glass-card p-5">
            <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
                <i data-lucide="history" class="w-5 h-5 text-accent"></i> Historique (50 derniers)
            </h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="text-slate-400 border-b border-slate-700">
                        <tr>
                            <th class="py-3 px-4 font-medium">Date</th>
                            <th class="py-3 px-4 font-medium">Sport</th>
                            <th class="py-3 px-4 font-medium">Joueur</th>
                            <th class="py-3 px-4 font-medium">Marché</th>
                            <th class="py-3 px-4 font-medium">Cote</th>
                            <th class="py-3 px-4 font-medium">Mise</th>
                            <th class="py-3 px-4 font-medium text-right">Gain</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody" class="divide-y divide-slate-800/50">
                        <!-- Injected via JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
