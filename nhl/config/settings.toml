# ─── NHL Bot Configuration ───────────────────────────────────────────────────
# Source unique pour tous les seuils et paramètres du bot.
# Stratégie de mise : section [betting] (nhl/core/betting.py). Voir nhl/reports/RECAP_AUDIT_P0_P3_2026-10-04.md.

[mode]
# Kill-switch (audit P0) : true = picks envoyés avec la mention PAPER et
# non comptés dans le Portfolio. Repasser à false seulement après validation.
paper_trading = true
# Critère de passage en réel (fixé à l'avance, audit 2026-10-04) : au moins go_live_min_bets paris
# avec cote de clôture ET borne basse de l'IC 95 % de l'EV de clôture (no-vig Pinnacle) > 0.
go_live_min_bets = 300

[thresholds.buteurs]
# Éligibilité (market_filter.evaluate_player_markets). Les anciens seuils OMEGA (grid search
# in-sample) ont été supprimés à l'audit P3 du 2026-10-04 : plus aucun code ne les lisait.
home_only = false
cote_min = 4.50  # HÉRITÉ : lu seulement par nhl/sim/legacy.py (la prod utilise [betting])

[thresholds.passeurs]
home_only = false  # audit 2026-10-04 : aligné sur la simulation (is_home est une feature du modèle)
cote_min = 2.50  # HÉRITÉ : idem

[thresholds.general]
atoi_min = 13.0

[thresholds.ev_adaptive]
# Seuils EV dynamiques selon la cote (P9)
low_odds_cutoff = 2.00
low_odds_min_ev = 0.08   # 8% minimum pour contrer le vig bookmaker
mid_odds_cutoff = 3.50
mid_odds_min_ev = 0.05   # 5% zone standard
high_odds_min_ev = 0.10  # 10% pour compenser la forte variance

[wave]
ecart_max_min = 5
force_envoi_min_avant = 17

[csv]
# Séparateur décimal pour les CSV de log ("," = format FR, "." = international)
decimal_separator = ","

[api]
mode = "regular"        # "regular" ou "playoff"
season_id = "20262027"
fallback_season_id = "20252026"
game_type = "2"         # 2 = saison régulière, 3 = playoffs
semaphore_limit = 20

[betting]
# Stratégie de mise (nhl/core/betting.py). Configuration « Équilibré, 1 pari / match »,
# choisie le 2026-10-04 parmi 672 configurations (nhl/reports/CONFIG_SEARCH_2026-10-04.md) :
# EV ≥ 8 %, poids du modèle 0,65 / 0,90 face au no-vig Pinnacle, 1 pari max par match, Kelly 1/6.
# Simulé : +122 U / saison (validation 2023-24), +83 U (contrôle 2024-25), ROI ≈ +19 %, drawdown 10-13 U.
# Mode proxy conservé : chaque pick affiche la cote seuil à trouver sur un book FR.
markets = ["but", "ast"]
# Books où l'utilisateur peut parier (mode "books" : cote d'exécution = la meilleure d'entre eux).
# Retirer ceux sans compte. Clés The Odds API (région eu).
exec_books = ["winamax_fr", "betclic_fr", "unibet_fr", "pmu_fr"]
# Aucun book FR ne cote les props NHL dans The Odds API (check_odds_coverage.py, 2026-10-04).
# exec_mode = "proxy" : cote d'exécution = médiane books soft US × exec_haircut (méthode du
# backtest), à défaut cote Pinnacle × pin_haircut ; le pick affiche la cote seuil à trouver
# à la main sur un book FR. "books" : meilleure cote parmi exec_books (si un jour couverts).
# Recalibrer les décotes avec nhl/scripts/calibrate_proxy.py (cotes saisies via /pris).
exec_mode = "proxy"
# Calibré le 2026-10-04 sur 15 matchs (dernières cotes Winamax avant le coup d'envoi vs The Odds API
# 5 min avant) : Winamax = 1,078 × médiane US au buteur (IC 95 % 1,069-1,093) et = cote Pinnacle
# « Oui » (ratio 1,00, IC 1,00-1,04). Rapport : nhl/reports/WINAMAX_CALIBRATION_2026-10-04.md
exec_haircut = 1.078          # buteur : Winamax / médiane US
exec_haircut_ast = 1.00       # passes : Winamax = médiane US (ratio 1,00, IC 0,96-1,02) ; avant le 2026-10-04 la prod
                              # appliquait 1,078 aux passes cotées par les books US (prix surestimé d'environ 8 %)
pin_haircut = 1.00
# Audit 2026-10-04 (P1) : no-vig de Shin, meilleure log-loss que le multiplicatif sur 2023-24
# (le multiplicatif surestime le « Oui » : 26,7 % prédit contre 24,9 % observé au buteur).
devig_method = "shin"
blend_w_but = 0.65           # poids du modèle vs no-vig Pinnacle (1 - w sur Pinnacle) ; appris en log-loss : 0,50 / 0,75
blend_w_ast = 0.90
cote_min_but = 1.5
cote_max_but = 15.0
cote_min_ast = 1.5
cote_max_ast = 6.0
ev_min_low = 0.08            # EV minimale (cote < 2.00 / 2.00-3.50 / > 3.50)
ev_min_mid = 0.08
ev_min_high = 0.08
no_pinnacle_extra_ev = 0.05  # EV supplémentaire exigée sans référence Pinnacle
# Journalisation pour de futures features (audit P2, sans effet sur les paris du soir)
log_match_context = true     # total de buts, 1N2, gardiens titulaires : ≈ 4 crédits par match et par vague
log_extra_markets = false    # cotes points / tirs cadrés : double la consommation de crédits
kelly_fraction = 0.1667      # Kelly 1/6
min_stake_u = 0.5            # sous ce montant : pas de pari (aucun plancher artificiel)
max_stake_but_u = 1.5
max_stake_ast_u = 2.0
max_game_exposure_u = 5.0    # paris corrélés d'un même match
max_bets_per_game = 1        # on ne garde que le meilleur EV de chaque match (0 = illimité)
max_daily_exposure_u = 30.0

[journal]
# Journalisation pour de futures features : sans effet sur les paris ni sur la version du
# simulateur (qui ne hache que [betting]).
dailyfaceoff = true  # lignes, unités PP / PK et blessés Daily Faceoff des équipes de chaque vague (table dfo_lines)

[model]
# Moteur de prod (nhl/core/ensemble_model.TemporalCalibratedGBM), lu par nhl/scripts/train_models.py,
# y compris par le retrain hebdomadaire du VPS. Avant le 2026-10-08, ce retrain entraînait un
# LightGBM seul au lieu de l'ensemble validé.
algos = ["lgbm", "xgb", "cat"]

[fr_odds]
# Vraies cotes joueurs des books français, lues sur leurs pages publiques sans compte
# (nhl/core/fr_odds.py ; test : python -m nhl.core.fr_odds --probe). Toutes les cotes lues sont
# journalisées (table book_odds) à chaque vague et à T-5, avec Pinnacle et la médiane US.
# Winamax ne sert ses données qu'aux IP françaises : lu depuis la migration sur le VPS OVH (France,
# 2026-10-06). Sur ce VPS la page renvoie un état vide, le canal temps réel répond : source "socket".
enabled = true
books = ["winamax", "unibet", "betclic"]
# true : la meilleure cote parmi exec_books remplace la cote estimée (médiane US décotée) pour
# sélectionner, miser et afficher le pick (« @3,02 chez Betclic »). false : journalisation seule.
# Sans cote française pour un joueur (site en panne, joueur non coté), la cote estimée reste utilisée.
use_as_exec = true
exec_books = ["winamax", "unibet", "betclic"]  # sites où tu as un compte (les 3, 2026-10-05)
winamax_source = "socket"  # "page" (PRELOADED_STATE) ou "socket" (canal temps réel) ; l'autre sert de repli
proxy_winamax = ""        # ex. "socks5h://127.0.0.1:1080" si Winamax doit sortir par une IP française
timeout_s = 20
min_delay_s = 1.0         # pause entre deux pages d'un même site
# Marché « au moins 1 point » : cotes FR, Pinnacle et médiane US journalisées dans book_odds à l'aperçu et
# aux picks confirmés, JAMAIS pariées (évaluation du modèle points, 2026-10-07). Coût : +1 requête Odds API
# (player_points) par match et par vague ; aucune à la clôture.
log_points = true

[early_season]
# Mode découverte (2026-10-04) : picks pour les joueurs à moins de 10 matchs cette saison, avec
# leurs G/GP et A/GP mélangés à ceux de la saison passée : (saison + shrink_k × saison passée) / (gp + shrink_k).
# EV exigée plus haute et mise réduite ; picks marqués 🧪 et exclus du compteur go_live_min_bets.
# Bascule automatique en mode normal à 10 matchs. Backtest : nhl/reports/EARLY_SEASON_2026-10-04.md
enabled = true
min_prev_gp = 20      # matchs joués la saison passée (les recrues sans historique restent exclues)
shrink_k = 10
ev_min = 0.15        # choisi sur la validation (EV 8 / 12 / 15 %) : +6,5 U en 2023-24, -0,3 U en contrôle 2024-25 (≈ neutre)
stake_mult = 0.5      # mise Kelly × 0,5
